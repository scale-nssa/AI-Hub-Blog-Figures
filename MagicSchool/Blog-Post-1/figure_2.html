var subjects  = ["All Core Subjects", "English/Language Arts", "Social Studies", "Special Education", "Science/STEM", "Math", "Career and Technical Education", "Electives", "World Languages", "Art and/or Music"];
var nGrades   = 4;
var activeMask = 15;
var layout = {
  xaxis: {side: "bottom", tickangle: -45},
  yaxis: {autorange: "reversed"},
  plot_bgcolor: "white",
  paper_bgcolor: "white",
  margin: {t: 30, l: 180, b: 130, r: 80},
  height: 520,
  width:  950,
  font: {size: 12}
};

function getTrace(d) {
  return {
    type: "heatmap",
    z: d.z,
    x: subjects,
    y: d.y,
    zmin: d.zmin,
    zmax: d.zmax,
    text: d.text,
    texttemplate: "%{text}",
    colorscale: "Viridis",
    colorbar: {title: {text: "# Teachers"}}
  };
}

Plotly.newPlot("heatmap", [getTrace(comboData[String(activeMask)])], layout);

function toggleGrade(idx) {
  var newMask = activeMask ^ (1 << idx);
  if (newMask === 0) return;  // keep at least one grade active
  activeMask = newMask;
  for (var i = 0; i < nGrades; i++) {
    var btn = document.getElementById("btn-" + i);
    var isActive = (activeMask & (1 << i)) !== 0;
    btn.dataset.active = isActive ? "true" : "false";
    if (isActive) { btn.classList.remove("btn-inactive"); }
    else          { btn.classList.add("btn-inactive");    }
  }
  Plotly.react("heatmap", [getTrace(comboData[String(activeMask)])], layout);
}
</script>
